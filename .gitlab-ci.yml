stages:
  - test
  - build
  - deploy

default:
  tags:
    - docker
    - shcj

variables:
  DEPLOY_DIR: /app/cachecloud
  IMAGE_NAME: cachecloud
  FRONTEND_IMAGE_NAME: cachecloud-ui
  HTTP_PROXY: http://192.168.8.188:7897
  HTTPS_PROXY: http://192.168.8.188:7897
  NO_PROXY: localhost,127.0.0.1,::1,192.168.8.0/24

test:
  stage: test
  image: docker:26.1.3-cli
  script:
    - MYSQL_ROOT_PASSWORD=validation REDIS_PASSWORD=validation CACHECLOUD_IMAGE=cachecloud:validation CACHECLOUD_FRONTEND_IMAGE=cachecloud-ui:validation docker compose -f compose.yaml config -q
    - docker build --build-arg HTTP_PROXY --build-arg HTTPS_PROXY --build-arg NO_PROXY --target build -t "$IMAGE_NAME:build-$CI_COMMIT_SHA" .
    - docker build --build-arg HTTP_PROXY --build-arg HTTPS_PROXY --build-arg NO_PROXY --target build -f cachecloud-ui/Dockerfile -t "$FRONTEND_IMAGE_NAME:build-$CI_COMMIT_SHA" cachecloud-ui

build-image:
  stage: build
  image: docker:26.1.3-cli
  script:
    - docker build --build-arg HTTP_PROXY --build-arg HTTPS_PROXY --build-arg NO_PROXY -t "$IMAGE_NAME:$CI_COMMIT_SHA" -t "$IMAGE_NAME:latest" .
    - docker build --build-arg HTTP_PROXY --build-arg HTTPS_PROXY --build-arg NO_PROXY -f cachecloud-ui/Dockerfile -t "$FRONTEND_IMAGE_NAME:$CI_COMMIT_SHA" -t "$FRONTEND_IMAGE_NAME:latest" cachecloud-ui
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "feature/front-end"

deploy-production:
  stage: deploy
  image: docker:26.1.3-cli
  resource_group: cachecloud-production
  environment:
    name: production
    url: https://redis-portal.shcj-s.com
  before_script:
    - test -n "$MYSQL_ROOT_PASSWORD"
    - test -n "$REDIS_PASSWORD"
    - mkdir -p "$DEPLOY_DIR/deploy/mysql"
  script:
    - cp compose.yaml "$DEPLOY_DIR/compose.yaml"
    - cp deploy/mysql/init.sql "$DEPLOY_DIR/deploy/mysql/init.sql"
    # compose 还挂了这两个：漏拷会让 binlog 配置和备份 sidecar 静默失效
    - cp deploy/mysql/backup.sh "$DEPLOY_DIR/deploy/mysql/backup.sh"
    - cp -r deploy/mysql/conf.d "$DEPLOY_DIR/deploy/mysql/"
    - printf 'CACHECLOUD_IMAGE=%s\nCACHECLOUD_FRONTEND_IMAGE=%s\nCACHECLOUD_FRONTEND_PORT=%s\nCACHECLOUD_BACKEND_PORT=%s\nSERVER_DOMAIN=%s\nMYSQL_ROOT_PASSWORD=%s\nREDIS_PASSWORD=%s\n' "$IMAGE_NAME:$CI_COMMIT_SHA" "$FRONTEND_IMAGE_NAME:$CI_COMMIT_SHA" "28082" "28083" "https://redis-portal.shcj-s.com" "$MYSQL_ROOT_PASSWORD" "$REDIS_PASSWORD" > "$DEPLOY_DIR/.env"
    - chmod 600 "$DEPLOY_DIR/.env"
    - docker compose --project-directory "$DEPLOY_DIR" -f "$DEPLOY_DIR/compose.yaml" up -d --remove-orphans
    - docker compose --project-directory "$DEPLOY_DIR" -f "$DEPLOY_DIR/compose.yaml" ps
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "feature/front-end"
