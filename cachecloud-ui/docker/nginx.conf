map $http_origin $cachecloud_upstream_origin {
    default $http_origin;
    "https://redis-portal.shcj-s.com" "http://redis-portal.shcj-s.com";
}

map $http_x_forwarded_proto $cachecloud_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    # Docker 容器重建后 IP 会变化。变量形式的 proxy_pass 配合内置 DNS，
    # 可在不重启 nginx 的情况下重新解析 web 服务名。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api/v1|manage|admin)(/|$) {
        set $cachecloud_backend http://web:8080;
        proxy_pass $cachecloud_backend;
        proxy_http_version 1.1;
        # 必须用 $http_host 保留端口：后端据此计算请求来源，端口丢失会让同源请求被
        # Spring 判成跨域，而 ApiCorsConfig 的白名单不含该来源，直接 403 Invalid CORS request
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cachecloud_forwarded_proto;
        proxy_set_header Origin $cachecloud_upstream_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
    }
}
