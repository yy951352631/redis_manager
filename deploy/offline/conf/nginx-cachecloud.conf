# CacheCloud 前端站点 + 后端反代。由 install.sh 从模板生成。
# 放在 nginx 的 conf.d 下，被主配置的 include 加载。

# 后端 Origin 改写：后端按请求来源判断是否跨域，这里保持与浏览器一致即可。
# 需要在 HTTPS 前置（如 F5/SLB）后面部署时，把默认值改成对外的 https 地址。
map $http_origin $cachecloud_upstream_origin {
    default $http_origin;
}

upstream cachecloud_backend {
    server 127.0.0.1:@BACKEND_PORT@;
    keepalive 32;
}

server {
    listen      @HTTP_PORT@;
    server_name _;

    root  @WEB_ROOT@/dist;
    index index.html;

    access_log /var/log/nginx/cachecloud.access.log;
    error_log  /var/log/nginx/cachecloud.error.log;

    # 前端是 SPA，刷新任意路由都要回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存；index.html 绝不能缓存，否则升级后仍加载旧 JS
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~ ^/(api/v1|manage|admin)(/|$) {
        proxy_pass http://cachecloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 与后端 spring.servlet.multipart 的 2200MB 对齐。默认 1MB，离线分析要传的
        # RDB/AOF 动辄几十 MB，超限时 nginx 直接回 413，请求根本到不了后端
        client_max_body_size 2200m;
        # 不在 nginx 侧把整个文件缓冲到磁盘再转发：几百 MB 的文件会先写一遍本地磁盘，
        # 既慢又占空间，改为边收边转
        proxy_request_buffering off;
        # 大文件上传耗时远超默认 60s
        client_body_timeout 1800s;
        proxy_send_timeout  1800s;
        # 键值分析、离线解析、压测都是长请求
        proxy_read_timeout  1800s;

        # 必须用 $http_host 保留端口：后端据此计算请求来源，端口丢失会让同源请求被
        # Spring 判成跨域，而 ApiCorsConfig 的白名单不含该来源，直接 403 Invalid CORS request
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $cachecloud_upstream_origin;
        proxy_set_header Cookie            $http_cookie;
    }
}
