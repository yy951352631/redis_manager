spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test}
  main:
    allow-bean-definition-overriding: true
    # XML 装配 + default-autowire="byName"，保留 Spring Boot 2.6 之前的循环依赖行为
    allow-circular-references: true
  mvc:
    servlet:
      load-on-startup: 1
    log-resolved-exception: true
  servlet:
    multipart:
      max-file-size: 2200MB
      max-request-size: 2200MB

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

cachecloud:
  # 报警与巡检作业开关（实例分钟报警 / 存活巡检 / 应用指标巡检）。
  # 留空 = 按环境判定：online/open 执行，test/local 不执行；
  # 显式 true 可在测试环境跑通整条报警链路，显式 false 可临时静默。
  alert:
    enabled: ${CACHECLOUD_ALERT_ENABLED:}
  # 允许跨来源访问的站点，逗号分隔，支持 http://192.168.*.*:* 这类通配。
  # 同源部署（Nginx 同时托管 SPA 与反代）无需配置；留空表示只接受同源请求。
  # 已开启 allowCredentials，切勿配成 *。
  cors:
    allowed-origins: ${CACHECLOUD_CORS_ALLOWED_ORIGINS:http://localhost:3333,http://127.0.0.1:3333}
  jdbc:
    driver: com.mysql.cj.jdbc.Driver
    validationQuery: select 1 from dual
  redis:
    cli:
      # CacheCloud 本机 redis-cli；留空则依次尝试 /home/redis/bin/redis-cli、~/bin/redis-cli、PATH
      path:
      # SSH 到 Redis 机器执行命令时 redis-cli 目录（同步 Tool 默认也落在此目录）
      remote-bin: /home/redis/bin
  ai:
    enabled: false
    provider: deepseek
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
    max-tokens: 2048
  kafka:
    enabled: false

management:
  server:
    port: -1
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: '*'
    enabled-by-default: true
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
    shutdown:
      enabled: false
    restart:
      enabled: false
    pause:
      enabled: false
    heapdump:
      enabled: false
    refresh:
      enabled: false
    auditevents:
      enabled: false
    jolokia:
      enabled: false
    env:
      post:
        enabled: false
