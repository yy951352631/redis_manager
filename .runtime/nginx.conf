map $http_origin $cachecloud_upstream_origin {
    default $http_origin;
    "https://redis-portal.shcj-s.com" "http://redis-portal.shcj-s.com";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api/v1|manage|admin)(/|$) {
        proxy_pass http://cachecloud-web:8080;
        proxy_http_version 1.1;
        # 与后端 spring.servlet.multipart 的 2200MB 对齐。默认 1MB，离线分析要传的
        # RDB/AOF 动辄几十 MB，超限时 nginx 直接回 413，请求根本到不了后端
        client_max_body_size 2200m;
        # 不在 nginx 侧把整个文件缓冲到磁盘再转发：几百 MB 的文件会先写一遍本地磁盘，
        # 既慢又占空间，改为边收边转
        proxy_request_buffering off;
        # 大文件上传耗时远超默认 60s
        client_body_timeout 1800s;
        proxy_send_timeout 1800s;
        # 必须用 $http_host 保留端口：后端据此计算请求来源，端口丢失会让同源请求被
        # Spring 判成跨域，而 ApiCorsConfig 的白名单不含该来源，直接 403 Invalid CORS request
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin $cachecloud_upstream_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 1800s;
    }
}
